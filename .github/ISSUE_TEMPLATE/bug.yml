name: Bug
description: 버그 리포트
title: "[Bug] "
labels: ["type:fix"]
body:
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: "기기/브라우저/OS, 로컬 or 배포"
